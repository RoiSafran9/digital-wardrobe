<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
body{margin:0;width:390px;height:844px;background:#0A0A0A;font-family:"Arial Narrow",Arial,sans-serif;color:#FF6A13;overflow:hidden}
.rail{position:absolute;top:220px;left:0;right:0;height:260px;background:#FF6A13}
.perf{position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#0A0A0A 0 10px,transparent 10px 26px)}
.f{position:absolute;top:30px;width:150px;height:200px;background:#fff}
.g{position:absolute;inset:20px;border-radius:40% 40% 8% 8%}
.flag{position:absolute;top:196px;left:200px;width:26px;height:40px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.big{position:absolute;top:60px;left:20px;font-size:96px;font-weight:900;letter-spacing:-2px}
.pins{position:absolute;top:540px;left:20px;right:20px;height:120px;border-top:2px solid #FF6A13}
.pin{position:absolute;top:0;width:60px;height:90px;border:2px solid #FF6A13}
.add{position:absolute;bottom:40px;left:20px;right:20px;height:60px;border:3px solid #FF6A13;font-size:26px;font-weight:900;text-align:center;line-height:60px;letter-spacing:4px}
</style></head><body>
<div class="big">038</div>
<div class="rail"><div class="perf" style="top:6px"></div><div class="perf" style="bottom:6px"></div>
<div class="f" style="left:-40px"><div class="g" style="background:#26325A"></div></div>
<div class="f" style="left:120px"><div class="g" style="background:#8C8C8C"></div></div>
<div class="f" style="left:280px"><div class="g" style="background:#7A5236"></div></div></div>
<div class="flag"></div>
<div class="pins"><div class="pin" style="left:0"></div><div class="pin" style="left:80px"></div></div>
<div class="add">+ ADD</div>
</body></html>
