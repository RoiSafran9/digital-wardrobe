<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:{{ bg }};overflow:hidden">
  <div style="height:{{ h }};aspect-ratio:{{ ar }};max-width:84%;transform:{{ tf }};transition:transform .5s cubic-bezier(.2,.8,.2,1), filter .5s;filter:drop-shadow(0 8px 10px rgba(0,0,0,.13)) drop-shadow(0 1px 1px rgba(0,0,0,.1)) {{ bright }}">
    <div style="width:100%;height:100%;background:{{ fill }};clip-path:{{ clip }};border-radius:{{ radius }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:250},&quot;item&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;shape&quot;:&quot;shirt&quot;,&quot;color&quot;:&quot;#b98a5c&quot;,&quot;pattern&quot;:&quot;Solid&quot;},&quot;tsType&quot;:&quot;object&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;front&quot;,&quot;side&quot;,&quot;back&quot;,&quot;side2&quot;],&quot;default&quot;:&quot;front&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
const SH = {
  tee: { c: 'polygon(32% 0,68% 0,100% 20%,86% 40%,76% 33%,76% 100%,24% 100%,24% 33%,14% 40%,0 20%)', h: 58, ar: 1 },
  shirt: { c: 'polygon(35% 0,65% 0,91% 9%,100% 88%,84% 90%,76% 34%,76% 100%,24% 100%,24% 34%,16% 90%,0 88%,9% 9%)', h: 66, ar: .92 },
  sweater: { c: 'polygon(33% 0,67% 0,92% 10%,100% 86%,85% 88%,77% 36%,78% 100%,22% 100%,23% 36%,15% 88%,0 86%,8% 10%)', h: 60, ar: 1.02 },
  coat: { c: 'polygon(36% 0,64% 0,90% 7%,100% 74%,85% 76%,78% 26%,80% 100%,20% 100%,22% 26%,15% 76%,0 74%,10% 7%)', h: 80, ar: .72 },
  pants: { c: 'polygon(12% 0,88% 0,97% 100%,57% 100%,50% 22%,43% 100%,3% 100%)', h: 76, ar: .5 },
  skirt: { c: 'polygon(24% 0,76% 0,100% 100%,0 100%)', h: 54, ar: .86 },
  dress: { c: 'polygon(35% 0,40% 0,41% 10%,59% 10%,60% 0,65% 0,67% 12%,74% 36%,100% 100%,0 100%,26% 36%,33% 12%)', h: 80, ar: .6 },
  shoe: { r: '48% 56% 22% 22% / 62% 72% 28% 28%', h: 24, ar: 2.2 },
  boot: { c: 'polygon(18% 0,62% 0,62% 54%,96% 70%,100% 100%,18% 100%)', h: 46, ar: 1 },
  bag: { c: 'polygon(30% 0,70% 0,70% 18%,86% 22%,100% 100%,0 100%,14% 22%,30% 18%,36% 18%,36% 6%,64% 6%,64% 18%,70% 18%)', h: 54, ar: 1 },
  acc: { r: '40%', h: 14, ar: 3 }
};
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || {};
    const sh = SH[it.shape] || SH.tee;
    const c = it.color || '#cccccc';
    const view = this.props.view || 'front';
    const base = `linear-gradient(160deg, color-mix(in oklab, ${c} 78%, white) 0%, ${c} 52%, color-mix(in oklab, ${c} 84%, black) 100%)`;
    const p = it.pattern;
    let pat = '';
    if (p === 'Striped') pat = 'repeating-linear-gradient(180deg, transparent 0 7px, rgba(250,248,244,.92) 7px 12px),';
    else if (p === 'Ribbed' || p === 'Cable knit') pat = 'repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 6px),';
    else if (p === 'Denim') pat = 'repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 1px, transparent 1px 4px),';
    else if (p === 'Floral') pat = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,.75) 0 2.5px, transparent 3px) 0 0/16px 16px, radial-gradient(circle at 70% 70%, rgba(150,60,70,.35) 0 2.5px, transparent 3px) 0 0/16px 16px,';
    const tf = { front: 'none', side: 'scaleX(.42)', back: 'scaleX(-1)', side2: 'scaleX(-.42)' }[view] || 'none';
    const sc = this.props.scale ?? 1;
    return {
      bg: this.props.bare ? 'transparent' : 'var(--tile, #f3f2ef)',
      fill: pat + base,
      clip: sh.c || 'none',
      radius: sh.r || '0',
      h: (sh.h * sc) + '%',
      ar: String(sh.ar),
      tf: (this.props.rotate ? `rotate(${this.props.rotate}deg) ` : '') + tf,
      bright: view === 'back' ? 'brightness(.9)' : ''
    };
  }
}
</script>
</body>
</html>
