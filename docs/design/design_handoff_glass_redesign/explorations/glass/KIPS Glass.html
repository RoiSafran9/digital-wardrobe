<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>KIPS — Glass (1a) prototype</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#E4E3E0;font-family:var(--font-system)}#root{padding:30px 0}
a{color:#0B5EFF}a:hover{opacity:.8}
@keyframes rd-fade{from{opacity:0}to{opacity:1}}
@keyframes rd-rise{from{opacity:.4;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rd-pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
@keyframes rd-scan{from{top:-90px}to{top:100%}}
@keyframes rd-turn{0%,100%{transform:perspective(900px) rotateY(-14deg)}50%{transform:perspective(900px) rotateY(14deg)}}
@keyframes rd-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes rd-float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes kips-shimmer{from{transform:translateX(-100%) skewX(-12deg)}to{transform:translateX(200%) skewX(-12deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="../../ui_kits/kips-ios/ios-frame.js"></script>
<script type="text/babel" src="../redesign/shared.js"></script>
<script type="text/babel" src="../redesign/dir-glass.js"></script>
<script type="text/babel" src="../home/home-options.js"></script>
<script type="text/babel" src="../home/home-final.js"></script>
<script type="text/babel" src="glass-capture.js"></script>
<script type="text/babel" src="glass-build.js"></script>
<script type="text/babel" src="glass-me.js"></script>
<script type="text/babel" src="glass-onboarding.js"></script>

</body></html>
